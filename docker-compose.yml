version: '3.8'

services:
  deepseek-ocr:
    build: .
    container_name: deepseek-ocr-app
    ports:
      - "8000:8000"
    environment:
      # Model configuration
      - MODEL_NAME=${MODEL_NAME:-deepseek-ai/deepseek-vl-1.3b-chat}
      - DEVICE=${DEVICE:-auto}
      - LOAD_IN_8BIT=${LOAD_IN_8BIT:-false}
      - LOAD_IN_4BIT=${LOAD_IN_4BIT:-false}
    volumes:
      # Mount model cache to persist downloads
      - model-cache:/root/.cache/huggingface
      # Mount static files (optional, for development)
      - ./static:/app/static
    restart: unless-stopped
    # For GPU support, uncomment below and install nvidia-docker
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  model-cache:
    driver: local
